@keyframes breeze{0%{opacity:0;transform:translate(-42px,-22px)}18%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(100px,130px)}}
@keyframes rise{from{opacity:.35;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.petals,.petals-late{animation:none;opacity:.7}.sun{animation:none}}
</style>
