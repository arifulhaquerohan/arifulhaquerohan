<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Ariful Haque Rohan — Sakura at dusk</title>
<desc id="desc">Japanese woodblock-inspired landscape with Mount Fuji, a vermilion sun, layered indigo hills, and a flowering cherry branch. A brief breeze carries petals across the scene. Full-stack developer in Dhaka.</desc>
<defs>
<clipPath id="frame"><rect width="1200" height="560" rx="16"/></clipPath>
<pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".6" fill="#d4d9df" opacity=".12"/><circle cx="6" cy="7" r=".5" fill="#080e25" opacity=".15"/></pattern>
<g id="flower" fill="#f4cbd1"><ellipse cy="-8" rx="5" ry="8"/><ellipse cy="-8" rx="5" ry="8" transform="rotate(72)"/><ellipse cy="-8" rx="5" ry="8" transform="rotate(144)"/><ellipse cy="-8" rx="5" ry="8" transform="rotate(216)"/><ellipse cy="-8" rx="5" ry="8" transform="rotate(288)"/><circle r="3" fill="#c56877"/></g>
