<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Ariful Haque Rohan — Riverworks</title>
<desc id="desc">Full-stack developer in Dhaka. Mint river-like paths join together on a deep blue field, representing connected software systems.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}.streams{animation:arrive 1800ms cubic-bezier(.23,1,.32,1) both}.crossing{animation:arrive 1800ms 120ms cubic-bezier(.23,1,.32,1) both}.ripple{transform-origin:952px 294px;animation:ripple 2400ms 400ms cubic-bezier(.23,1,.32,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes ripple{from{opacity:0;transform:scale(.92)}50%{opacity:1}to{opacity:.45;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.streams,.crossing,.ripple{animation:none}}
</style>
<defs><clipPath id="frame"><rect width="1200" height="540" rx="24"/></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="1200" height="540" fill="#1238a5"/>
