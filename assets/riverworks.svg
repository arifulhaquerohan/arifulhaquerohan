<path d="M823 -60V91C823 166 1097 150 1097 294S874 404 874 485V590"/>
<path d="M873 -60V77C873 126 1147 125 1147 294S924 423 924 499V590"/>
</g>
<g class="crossing" fill="none" stroke="#71d6d4" stroke-width="11">
<path d="M1230 42C1000 42 1010 120 1010 182S750 228 750 320S1100 422 1230 422"/>
<path d="M1230 72C1040 72 1040 130 1040 182S780 250 780 320S1100 452 1230 452"/>
</g>
<circle class="ripple" cx="952" cy="294" r="100" fill="none" stroke="#f5f9ff" stroke-width="1" opacity=".45"/>
<circle cx="952" cy="294" r="8" fill="#f5f9ff"/>
<text x="56" y="65" font-size="21" fill="#b9f5d8">Rohan / Riverworks</text>
<text x="54" y="178" font-size="62" font-weight="700" letter-spacing="-2" fill="#f5f9ff">Ariful Haque</text>
<text x="51" y="271" font-size="100" font-weight="700" letter-spacing="-5" fill="#f5f9ff">Rohan.</text>
<text x="56" y="341" font-size="28" fill="#f5f9ff">Good software connects.</text>
