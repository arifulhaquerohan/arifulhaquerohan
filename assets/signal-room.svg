<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Ariful Haque Rohan — software engineer in Dhaka. Behind every interface, a system.</title><desc id="desc">Cyberpunk system archive in midnight blue, electric cyan, and magenta.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#18253b" stroke-width="1"/></pattern><linearGradient id="accent"><stop stop-color="#50f5e9"/><stop offset="1" stop-color="#ef5bc5"/></linearGradient></defs><path d="M22 1H1178L1199 22V528L1178 549H22L1 528V22Z" fill="#090e1b" stroke="#2c3d56"/><path d="M22 1H360" stroke="#50f5e9" stroke-width="3"/><rect x="720" y="24" width="455" height="507" fill="url(#grid)"/><text x="42" y="48" fill="#50f5e9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">R / SYSTEM ARCHIVE</text><text x="865" y="48" fill="#9aabc6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="2">DHAKA · UTC +06:00</text><path d="M42 73H1158" stroke="#27364c"/><text x="42" y="122" fill="#9aabc6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="2">SOFTWARE ENGINEER / FULL-STACK DEVELOPER</text><text x="38" y="211" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-2">ARIFUL HAQUE</text><text x="42" y="303" fill="#ef5bc5" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">ROHAN</text><text x="37" y="300" fill="#50f5e9" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">ROHAN</text><text x="40" y="301" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">ROHAN</text><path d="M45 324H114L123 315H360" fill="none" stroke="#ef5bc5" stroke-width="2"/><text x="42" y="374" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0">Behind every interface, a system.</text><text x="42" y="409" fill="#9aabc6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">I build the connections that make it work.</text><path d="M42 451H687" stroke="#27364c"/><text x="42" y="483" fill="#50f5e9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CORE MODULES</text><text x="42" y="515" fill="#c9d7ed" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0">PYTHON  /  DJANGO  /  POSTGRESQL</text><g fill="none"><path d="M795 124L1105 124L1150 169V394L1105 439H795L750 394V169Z" stroke="#3c586c"/><path d="M811 145H1093L1128 180V384L1093 418H811L773 384V180Z" stroke="#50f5e9" stroke-opacity=".35"/><circle cx="951" cy="280" r="119" stroke="#354159" stroke-dasharray="3 9"/><path d="M734 281H1169M951 97V461" stroke="#26364e"/></g><path d="M869 378V182H960Q1038 182 1038 244Q1038 287 999 303L1050 378H995L934 277H960Q990 277 990 246Q990 227 960 227H916V378Z" fill="#50f5e9"/><path d="M971 326L1002 378H1050L1016 326Z" fill="#ef5bc5"/><g fill="#ef5bc5"><rect x="745" y="275" width="11" height="11"/><rect x="1144" y="275" width="11" height="11"/></g><text x="823" y="485" fill="#50f5e9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">IDENTITY / AHR</text><text x="823" y="514" fill="#9aabc6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="2">HUMAN BEHIND THE CODE</text></svg>