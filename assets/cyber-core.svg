<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Ariful Haque Rohan — Cybernetic Core</title><desc id="desc">Full-stack developer in Dhaka. A cyan reactor with counter-rotating rings and amber data signals illustrates the connection between interfaces, APIs, and data. Decorative animation does not indicate live system activity.</desc>
<defs><clipPath id="frame"><rect width="1200" height="550" rx="18"/></clipPath><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#183043" stroke-width=".7"/></pattern><radialGradient id="field"><stop stop-color="#104556" stop-opacity=".7"/><stop offset="1" stop-color="#07111d" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.outer,.inner{transform-origin:930px 261px}.outer{animation:orbit 24s linear infinite}.inner{animation:reverse-orbit 16s linear infinite}.signal{animation:signal 4200ms linear infinite}.signal.second{animation-delay:1400ms}.signal.third{animation-delay:2800ms}.core{animation:charge 4200ms cubic-bezier(.77,0,.175,1) infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes reverse-orbit{to{transform:rotate(-360deg)}}
@keyframes signal{0%{opacity:0;transform:translateX(0)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(158px)}}
@keyframes charge{0%,100%{opacity:.4}50%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.outer,.inner,.signal,.core{animation:none}.signal{opacity:0}.core{opacity:.65}}
</style>
